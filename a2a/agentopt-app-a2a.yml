discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: agentopt.app
  note: >-
    Served from the apex host, which is also the only API host (POST https://agentopt.app/v1/select) —
    one uvicorn origin behind an AWS us-west-2 application load balancer (priorflow-servant-alb). The
    legacy /.well-known/agent.json returns a byte-identical copy of the same document (8,377 bytes), so
    the card is reachable at both paths. www.agentopt.app resolves to the same load balancer but the
    certificate covers only CN=agentopt.app, so every https://www request fails the TLS handshake. Every
    other /.well-known/* path returns the application's real JSON 404 ({"detail":"Not Found"}, 22 bytes)
    and a negative-control path that cannot exist also 404s, so the 200 on the card is a served
    document, not a catch-all. The card response carries x-robots-tag: noindex, nofollow. Ownership is
    not in question: the card's url is https://agentopt.app, its provider.organization is the same
    string the site's own /info page prints under "Provider:", and the site title is the card's name.
