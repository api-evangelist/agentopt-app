summary: >-
  Priorflow publishes none of the fourteen horizontal regulatory signals. The site has no legal pages at
  all — /terms, /privacy, /legal, /security, /contact and /about all return the application's JSON 404 —
  so there is no privacy policy to carry a data-subject-request process, a subprocessor list, a GPC
  statement or an incident SLA, and no accessibility, transparency, SBOM or data-residency page. The
  only disclosure-shaped statements are operational: the card says the ranking engine's "Algorithms,
  models, and infrastructure details are confidential commercial IP", the /info page says there is "no
  LLM on the select path", and /ready names the embedding provider (bedrock). None of those is a regime
  signal and none is recorded as one. An empty signals map is the measurement.
