summary: >-
  There is no separate test environment, no test-mode key prefix and no dry-run flag: production is the
  sandbox. The rehearsal surface is (1) the open free tier — the same POST /v1/select with fewer fields and
  top_n <= 5, callable with no credential — and (2) /try, a server-rendered browser form that POSTs
  same-origin to the production /v1/select with preset query chips (Web scrape, GitHub, SQL analytics,
  Slack), top_n, caller_agent, an optional API key field and an include_explanations toggle, showing ranked
  candidates and the raw JSON. The page states the key "is sent only as a request header and is not stored
  by this page" and that "Agents should call the API directly; this page is for human exploration."
playground:
  url: https://agentopt.app/try
  kind: hosted browser form (console) over the production endpoint
  inputs: [query (required), task description (optional), top_n (free cap 5 · paid cap 20), caller_agent, API key (optional), include_explanations (paid)]
  outputs: [ranked candidates with score bands, raw JSON]
test_vs_live:
  separate_environment: false
  key_prefixes:
    live: pf_live_
    test: none published
  note: One host, one key type. The free tier is the only "test mode", and it is production.
free_tier_as_rehearsal:
  endpoint: POST https://agentopt.app/v1/select
  credential: none (non-empty User-Agent required)
  returns: [id, score, score_band, name]
  caps: 'top_n <= 5; roughly 20/min · 120/hour · 500/day per IP'
  example_request_verbatim: |
    curl -sS https://agentopt.app/v1/select \
      -H 'Content-Type: application/json' \
      -H 'User-Agent: my-orchestrator/1.0' \
      -d '{"query":"Find a reliable MCP server for structured web scraping of product pages","top_n":5,"caller_agent":"my-orchestrator-v1"}'
  example_source: https://agentopt.app/info#integrate
