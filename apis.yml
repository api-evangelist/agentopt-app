aid: agentopt-app
name: Priorflow
description: >-
  Priorflow Intelligent Agent/Service Selector is a hosted, agent-native selection service at agentopt.app,
  operated by Vitaly Kantorovich, that ranks curated MCP servers and A2A agents for a natural-language task
  under stated constraints (reliability, cost, latency, autonomy, maturity) using hybrid structured + semantic
  matching over a catalog of about 5,000 active / 7,900 total candidates — "registries help agents find
  candidates; Priorflow helps agents choose among them". The whole product is one JSON operation, POST
  https://agentopt.app/v1/select, with an open free tier (no key, four fields, top_n <= 5, roughly 20/min ·
  120/hour · 500/day per IP) and a paid X-API-Key tier sold as Stripe Checkout "select packs" that unlocks
  rich fields and top_n <= 20. It is described by an A2A agent card at /.well-known/agent-card.json
  (protocolVersion "1.0", two skills, conformant) whose vendor block is also the only machine-readable
  contract; the operator states plainly that the host is not an MCP server and runs no A2A task runtime,
  and publishes no OpenAPI, SDK, terms of service or privacy policy.
