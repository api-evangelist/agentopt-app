apis:
- aid: agentopt-app:priorflow-select-api
  name: Priorflow Intelligent Agent/Service Selector API
  description: >-
    One operation: POST /v1/select with JSON {query, top_n?, constraints?, weights?, caller_agent?} returns
    ordered MCP/A2A candidates with an absolute 0-1 hybrid-fit score (0.55 usable, 0.72+ strong). Free tier
    needs no key (non-empty User-Agent required) and returns id, score, score_band, name with top_n <= 5;
    a paid pf_live_ key sent as X-API-Key or Authorization Bearer unlocks source_url, endpoint/connect,
    homepage_url, endpoint_status, tags, dimensions, recommendation, clarifications and score_breakdown with
    top_n <= 20. Invalid keys 401; paid features without a key 402 upgrade_required; free-tier exhaustion 429
    with a machine-readable upgrade object. Described only by the A2A agent card's priorflow.api block — no
    OpenAPI is published; robots.txt disallows /v1/ to crawlers.
  humanURL: https://agentopt.app/info
  baseURL: https://agentopt.app/v1
