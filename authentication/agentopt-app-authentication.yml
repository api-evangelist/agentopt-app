  bearer: true
  credential_classes: 2
  headline: >-
    Two tiers, one credential. The free tier needs no credential at all — only a non-empty User-Agent header
    and, by convention, a stable caller_agent string in the body — and is open on this host while
    require_api_key is false (confirmed live via GET /ready). The paid tier uses a key sent as X-API-Key,
    or equivalently as Authorization: Bearer; keys are issued to a human "sponsor" once (Stripe Checkout at
    POST /v1/billing/checkout, one-time reveal at GET /v1/billing/session/{session_id}/key, or minted by the
    operator) and agents use them autonomously thereafter. Invalid keys always return 401; paid-only
    features without a key return 402 upgrade_required. No OAuth, no OIDC, no discovery documents.
