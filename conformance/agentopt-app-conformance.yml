    https://agentopt.app, defaultInputModes/defaultOutputModes present; served at both /.well-known/agent-card.json
    and /.well-known/agent.json (200, application/json, 8,377 bytes). Graded conformant in a2a/agentopt-app-a2a.yml.
  caveat: >-
    The card declares a2a_runtime.enabled false and interaction "POST /v1/select JSON skill", and /ready reports
