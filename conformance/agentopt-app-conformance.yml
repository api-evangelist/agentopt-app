summary: >-
  Priorflow's conformance profile is a single agent-discovery standard and a set of explicit negatives. It
  publishes an A2A agent card that passes every A2A 1.0.0 hard check (graded conformant in
  a2a/agentopt-app-a2a.yml) while stating in the card itself that no A2A runtime and no MCP server stand
  behind it; the actual interaction is a proprietary JSON call to POST /v1/select. It declares no OpenAPI,
  no OAuth/OIDC, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 9727 API catalog, no RFC
  9728 protected-resource metadata and no RFC 8594 sunset signalling. No certifications or compliance
  programme are published, so no Compliance pointer is emitted. There is no domain standard for
  agent-selection ranking to declare; the reward-only domain_standard_conformance slot is left empty
  rather than filled.
