summary: >-
  Priorflow publishes two tiers and no price. The free tier is an open pilot on this host (the card says
  "free tier open on this host when enabled" and /ready reports require_api_key false) with limited fields,
  top_n up to 5 and a per-IP volume envelope. The paid tier is a pf_live_ key that unlocks the rich fields,
  top_n up to 20, higher RPM and include_explanations; it is sold as a "select pack" — "metered selects
  and/or time-limited keys (Checkout)" — through self-serve Stripe Checkout at POST /v1/billing/checkout,
  with the amount set inside Stripe's hosted page and never printed on the site. Keys can also be issued by
  the operator (a temporary evaluation key "under a short-lived quota" on request), and a shared public
  evaluation key with a 1,000-call pool and a stated expiry was shown on /try on 2026-09-19.
